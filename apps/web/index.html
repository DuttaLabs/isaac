<!doctype html>

     paint matches: the attribute is set from an effect, which runs after
     React mounts, and a light flash on a light OS would be the difference. -->

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isaac — Optical Design</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
