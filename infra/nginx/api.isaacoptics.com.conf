# The only thing on this machine that faces the internet.
#
# It terminates TLS and performs the WebSocket upgrade; the relay itself binds
# to loopback and never sees a certificate.

server {
    listen 80;
    listen [::]:80;
    server_name api.isaacoptics.com;

    # Left open so certbot can renew without nginx being reconfigured.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04) has no standalone `http2` directive; it arrived
    # in 1.25.1. On the listen line it means the same thing here.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.isaacoptics.com;

    ssl_certificate     /etc/letsencrypt/live/api.isaacoptics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.isaacoptics.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # $connection_upgrade comes from the map in conf.d/websocket-upgrade.conf.
        # A bare "Connection: upgrade" would be wrong for the health endpoint,
        # which is an ordinary request over the same location.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A meeting is long-lived and mostly idle — nobody edits a lens every
        # minute. nginx's default 60s would close a working session between
        # edits, which the relay's own ping cannot prevent from this side.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
