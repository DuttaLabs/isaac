# The Isaac app: static files, and nothing else on this machine serves them.
#
# The relay is a separate hostname (api.isaacoptics.com) with its own config.
# Keeping them apart is what lets either be moved without touching the other —
# the app will end up on a CDN eventually, and the relay will not.

server {
    listen 80;
    listen [::]:80;
    server_name isaacoptics.com www.isaacoptics.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://isaacoptics.com$request_uri;
    }
}

# One canonical name. Two hostnames serving the same app would have two
# separate origins as far as the browser is concerned — different localStorage,
# different IndexedDB handles, and a relay origin check that has to allow both.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.isaacoptics.com;

    ssl_certificate     /etc/letsencrypt/live/isaacoptics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isaacoptics.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://isaacoptics.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name isaacoptics.com;

    ssl_certificate     /etc/letsencrypt/live/isaacoptics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isaacoptics.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Only Cloudflare may reach this directly. Without it the login is a
    # formality: anyone who knows the origin IP can ask for the site by name and
    # be served it, with Access never consulted. Generated by deploy-web.sh from
    # Cloudflare's published ranges; the trailing `*` means a missing file is
    # not an error, so an unproxied deployment still works.
    include /etc/nginx/isaac-origin.conf*;

    root /srv/isaac-web;
    index index.html;

    # Private while Isaac is not ready to be public. The trailing `*` makes this
    # a glob, so a missing file is not an error — deleting
    # /etc/nginx/isaac-auth.conf and reloading is all it takes to open the site
    # up, with no change here and no redeploy.
    include /etc/nginx/isaac-auth.conf*;

    # The Three.js chunk is 916 kB raw and 243 kB gzipped — nearly four times
    # smaller, on the single largest thing Isaac ships.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Vite puts a content hash in every asset filename, so a given file's
    # contents can never change. Cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The one file that must never be cached. It names the hashed assets, so a
    # stale copy points at files that no longer exist — a blank page after a
    # deploy, and the classic way to ship a broken static site.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
